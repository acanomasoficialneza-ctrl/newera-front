
    <div class="h-full p-6 flex flex-col gap-6 animate-in fade-in duration-300">
      
      <!-- Header Section -->
      <div class="flex flex-col md:flex-row items-start md:items-end justify-between border-b border-white/10 pb-4 gap-4">
        <div>
          <h1 class="text-3xl font-bold tracking-tight text-white mb-2">Auditoría del Sistema</h1>
          <p class="text-newera-text-muted text-sm">Registro de actividad y seguridad a nivel plataforma.</p>
        </div>
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
          <input type="date" [(ngModel)]="selectedDate" (ngModelChange)="onDateChange()" class="w-full sm:w-auto bg-black/50 border border-white/10 rounded px-3 py-2 text-white text-sm focus:outline-none focus:border-newera-primary cursor-pointer [color-scheme:dark]">
          <button (click)="downloadLogs()" class="bg-white/5 border border-white/10 text-white px-4 py-2 rounded hover:bg-white/10 transition-colors text-sm font-semibold whitespace-nowrap">
            Descargar Logs
          </button>
        </div>
      </div>

      <!-- Logs Terminal -->
      <div class="glass-panel flex-1 flex flex-col overflow-hidden bg-black/80 font-mono text-xs">
        
        <!-- Terminal Header -->
        <div class="flex items-center gap-2 px-4 py-2 border-b border-white/10 bg-black/40">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <span class="text-white/50 ml-4">system-audit.log</span>
        </div>

        <!-- Terminal Output -->
        <div class="p-4 flex-1 overflow-y-auto overflow-x-auto flex flex-col gap-1 text-newera-text-muted">
          <div *ngFor="let log of filteredLogs" class="flex flex-col md:flex-row md:items-start gap-1 md:gap-4 hover:bg-white/5 transition-colors px-3 py-3 md:py-1 rounded border-b border-white/5 md:border-transparent">
            
            <!-- Fecha y IP (Mobile) / Fecha (Desktop) -->
            <div class="flex justify-between md:block shrink-0">
              <span class="text-white/30">{{ log.fechaEvento | date:'yyyy-MM-dd HH:mm:ss' }}</span>
              <span class="text-white/30 md:hidden">{{ log.direccionIp }}</span>
            </div>

            <!-- Nivel y Mensaje -->
            <div class="flex gap-2 flex-1 items-start">
              <span class="w-14 md:w-16 shrink-0 font-bold" 
                    [ngClass]="{
                      'text-green-400': log.nivel === 'INFO',
                      'text-yellow-400': log.nivel === 'WARN',
                      'text-red-400': log.nivel === 'ERROR',
                      'text-blue-400': log.nivel === 'AUTH'
                    }">
                [{{ log.nivel }}]
              </span>
              <span class="text-white break-words flex-1">{{ log.mensaje }}</span>
            </div>

            <!-- IP (Desktop) -->
            <span class="text-white/30 ml-auto shrink-0 pl-4 hidden md:block">{{ log.direccionIp }}</span>
            
          </div>
        </div>

      </div>

    </div>
