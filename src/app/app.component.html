<!-- PWA: Alerta de Nueva Versión -->
<div *ngIf="hasUpdate" class="fixed top-4 left-1/2 -translate-x-1/2 z-[1000] animate-fade-in">
  <div class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-6 py-4 rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.5)] flex items-center gap-4 border border-blue-400/30">
    <div class="flex-shrink-0">
      <svg class="w-6 h-6 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
    </div>
    <div>
      <h3 class="font-bold">Nueva versión disponible</h3>
      <p class="text-sm text-blue-100">Presiona actualizar para disfrutar las mejoras.</p>
    </div>
    <button (click)="reloadApp()" class="ml-4 bg-white/20 hover:bg-white/30 text-white font-bold py-2 px-4 rounded-lg transition-all backdrop-blur-sm shadow-sm border border-white/20 uppercase text-xs tracking-wider">
      Actualizar
    </button>
  </div>
</div>

<!-- PWA: Pantalla de Pérdida de Conexión (Offline Glassmorphism) -->
<div *ngIf="isOffline" class="fixed inset-0 z-[1000] backdrop-blur-xl bg-black/80 flex flex-col items-center justify-center animate-fade-in text-white p-6">
  <div class="relative w-24 h-24 mb-8">
    <div class="absolute inset-0 border-4 border-red-500/30 rounded-full animate-ping"></div>
    <div class="absolute inset-2 border-4 border-red-500/50 rounded-full animate-ping" style="animation-delay: 0.2s"></div>
    <div class="absolute inset-0 bg-gradient-to-b from-red-600 to-red-800 rounded-full shadow-[0_0_30px_rgba(220,38,38,0.6)] flex items-center justify-center">
      <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414"></path>
      </svg>
    </div>
  </div>
  
  <h2 class="text-3xl font-bold mb-3 tracking-wider text-center text-red-50">Señal Perdida</h2>
  <p class="text-red-200/70 text-center max-w-md text-lg leading-relaxed">
    Te has desconectado de la red de Nova Capital. Esperando conexión a internet para reanudar operaciones...
  </p>
</div>

<!-- Estilos para animación fade-in -->
<style>
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fade-in 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
</style>

<router-outlet></router-outlet>
<app-loading-spinner></app-loading-spinner>
